# Use the explicit container name (not the bare service name "app"): when this
# nginx is also attached to the alt.nextgeniusinfotech.com network, that stack
# ALSO has a service named "app", so "app" would resolve ambiguously. The
# container name erp_app is globally unique and always resolves correctly.
upstream php-fpm {
    server erp_app:9000;
}

# ---------------------------------------------------------------------------
# alt.nextgeniusinfotech.com — duplicate site. This nginx is the shared edge:
# it terminates TLS and reverse-proxies to the alt_nginx container on the
# altnextgenius_erp network. See /var/www/alt.nextgeniusinfotech.com.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name alt.nextgeniusinfotech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name alt.nextgeniusinfotech.com;

    ssl_certificate     /etc/letsencrypt/live/alt.nextgeniusinfotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alt.nextgeniusinfotech.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/alt-access.log;
    error_log  /var/log/nginx/alt-error.log warn;

    # Reverse-proxy to the alt.nextgeniusinfotech.com stack's internal nginx
    # (alt_nginx, HTTP on :80) over the shared altnextgenius_erp network.
    location / {
        proxy_pass http://alt_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120;
    }
}

# HTTP — redirect everything to HTTPS, except ACME challenges
server {
    listen 80;
    server_name erptechindia.tech www.erptechindia.tech;

    # Allow Certbot to renew certs via webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server
server {
    listen 443 ssl http2;
    server_name erptechindia.tech www.erptechindia.tech;


    disable_symlinks off; 
    ssl_certificate     /etc/letsencrypt/live/erptechindia.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erptechindia.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/vendor/ {
    deny all;
    }
}
